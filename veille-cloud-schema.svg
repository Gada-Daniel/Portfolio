<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" font-family="Space Grotesk,DM Sans,system-ui,Segoe UI,sans-serif"><rect width="760" height="330" rx="14" fill="#0b1b3a"/><text x="380" y="36" font-size="19" fill="#f2b705" text-anchor="middle" font-weight="700">Où sont mes données ? Quelle loi s'applique ?</text><rect x="30" y="130" width="150" height="90" rx="10" fill="#18264f" stroke="#7b9dff" stroke-width="2"/><text x="105" y="170" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">Mon entreprise</text><text x="105" y="194" font-size="14" fill="#b8c4e4" text-anchor="middle" font-weight="500">et mes données</text><path d="M180 160 L300 90" stroke="#2b59ff" stroke-width="4" fill="none"/><path d="M180 190 L300 260" stroke="#f2b705" stroke-width="4" fill="none" stroke-dasharray="8 6"/><rect x="300" y="55" width="430" height="95" rx="10" fill="#14307a" stroke="#2b59ff" stroke-width="2"/><text x="515" y="88" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">Hébergeur européen (ex : SecNumCloud)</text><text x="515" y="112" font-size="14" fill="#c9d6ff" text-anchor="middle" font-weight="500">Soumis au droit français et européen (RGPD)</text><text x="515" y="134" font-size="14" fill="#c9d6ff" text-anchor="middle" font-weight="500">Données protégées des lois étrangères</text><rect x="300" y="205" width="430" height="95" rx="10" fill="#3a2c05" stroke="#f2b705" stroke-width="2"/><text x="515" y="238" font-size="15" fill="#f2b705" text-anchor="middle" font-weight="700">Hébergeur soumis à une loi étrangère</text><text x="515" y="262" font-size="14" fill="#ffe9a6" text-anchor="middle" font-weight="500">Exemple : le Cloud Act américain</text><text x="515" y="284" font-size="14" fill="#ffe9a6" text-anchor="middle" font-weight="500">Accès possible par des autorités étrangères</text></svg>